name: Issue 3 one-time AI link migration

on:
  push:
    branches:
      - site/issue-3-ai-domain-link

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: site/issue-3-ai-domain-link
          fetch-depth: 0

      - name: Replace legacy AI外電 URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_url = "https://ai-gaiden.pages.dev/"
          new_url = "https://ai.gaiden.news/"
          replacements = 0

          for filename in ("README.md", "index.html"):
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              count = content.count(old_url)
              content = content.replace(old_url, new_url)
              path.write_text(content, encoding="utf-8")
              replacements += count

          if replacements != 2:
              raise SystemExit(f"Expected 2 legacy URL replacements, found {replacements}")

          Path(".github/workflows/issue-3-link-once.yml").unlink()
          PY

      - name: Commit link migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html .github/workflows/issue-3-link-once.yml
          git commit -m 'fix: link AI外電 to ai.gaiden.news'
          git push origin HEAD:site/issue-3-ai-domain-link
